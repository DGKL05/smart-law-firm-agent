server:
  port: ${SERVER_PORT:8084}
spring:
  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8070}
      datasource:
        dify-flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${NACOS_CONFIG_GROUP:SMART_LAW_DEV}
            data-id: ai-sentinel-flow.json
            data-type: json
            rule-type: flow
        dify-hotspot:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${NACOS_CONFIG_GROUP:SMART_LAW_DEV}
            data-id: ai-sentinel-hotspot.json
            data-type: json
            rule-type: param-flow
        dify-circuit:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${NACOS_CONFIG_GROUP:SMART_LAW_DEV}
            data-id: ai-sentinel-degrade.json
            data-type: json
            rule-type: degrade
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/smart_law_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
dify:
  base-url: ${DIFY_BASE_URL:https://api.dify.ai/v1}
