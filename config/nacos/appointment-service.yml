server:
  port: ${SERVER_PORT:8083}
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:smartlaw}
    password: ${RABBITMQ_PASSWORD:smartlaw-local-rabbit}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: appointment-worker-
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1500
            readTimeout: 3000
            loggerLevel: BASIC
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/smart_law_appointment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
logging:
  level:
    com.example.dgkl.appointment.client: DEBUG
