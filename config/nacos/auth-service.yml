server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 10m
      cookie:
        name: ${OAUTH2_SESSION_COOKIE_NAME:SMART_LAW_AUTH_SESSION}
        http-only: true
        same-site: lax
        secure: ${OAUTH2_COOKIE_SECURE:false}
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/smart_law_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
