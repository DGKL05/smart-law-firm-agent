server:
  port: ${SERVER_PORT:8082}
spring:
  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8070}
      datasource:
        detail-flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${NACOS_CONFIG_GROUP:SMART_LAW_DEV}
            data-id: lawyer-sentinel-flow.json
            data-type: json
            rule-type: flow
        detail-hotspot:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${NACOS_CONFIG_GROUP:SMART_LAW_DEV}
            data-id: lawyer-sentinel-hotspot.json
            data-type: json
            rule-type: param-flow
        detail-circuit:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${NACOS_CONFIG_GROUP:SMART_LAW_DEV}
            data-id: lawyer-sentinel-degrade.json
            data-type: json
            rule-type: degrade
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 350ms
      timeout: 350ms
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/smart_law_lawyer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
logging:
  level:
    com.example.dgkl.lawyer.client.AppointmentClient: DEBUG
smart-law:
  directory-cache:
    ttl-seconds: 120
