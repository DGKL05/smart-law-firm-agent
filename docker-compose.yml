services:
  mysql:
    image: mysql:8.0
    container_name: smart-law-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/microservices:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: smart-law-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:7
    container_name: smart-law-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: smart-law-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: derby
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      args:
        MODULE_NAME: gateway-service
    container_name: smart-law-gateway
    environment:
      NACOS_ADDR: nacos:8848
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
    restart: on-failure

  auth-service:
    build:
      context: .
      args:
        MODULE_NAME: auth-service
    container_name: smart-law-auth-service
    environment:
      SERVER_PORT: 8081
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: on-failure

  lawyer-service:
    build:
      context: .
      args:
        MODULE_NAME: lawyer-service
    container_name: smart-law-lawyer-service
    environment:
      SERVER_PORT: 8082
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: on-failure

  appointment-service:
    build:
      context: .
      args:
        MODULE_NAME: appointment-service
    container_name: smart-law-appointment-service
    environment:
      SERVER_PORT: 8083
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: on-failure

  ai-service:
    build:
      context: .
      args:
        MODULE_NAME: ai-service
    container_name: smart-law-ai-service
    environment:
      SERVER_PORT: 8084
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: root
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      DIFY_API_KEY: ${DIFY_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      nacos:
        condition: service_healthy
    restart: on-failure

  admin-service:
    build:
      context: .
      args:
        MODULE_NAME: admin-service
    container_name: smart-law-admin-service
    environment:
      SERVER_PORT: 8085
      NACOS_ADDR: nacos:8848
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
    depends_on:
      mongodb:
        condition: service_started
      nacos:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    container_name: smart-law-frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  mysql-data:
  mongo-data:
