server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: lawyer-public
          uri: lb://lawyer-service
          predicates:
            - Path=/api/public/**
        - id: lawyer-center
          uri: lb://lawyer-service
          predicates:
            - Path=/api/lawyer-center/**
        - id: appointment-user
          uri: lb://appointment-service
          predicates:
            - Path=/api/me/appointments/**,/api/lawyer/appointments/**,/api/consultations/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**,/api/agent/**
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
